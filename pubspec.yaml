name: der_die_das
description: An application for practicing German articles (Der, Die, Das).

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.3
  window_manager: ^0.5.1
  intl: ^0.20.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  sqflite_common_ffi_web: ^1.1.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  vibration: ^3.1.5
  flutter_tts: ^4.2.3
  package_info_plus: ^9.0.0
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.10.4
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  sqlite3: ^3.1.2
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#0A0A0A"
  android_12:
    color: "#F8FAFC"
    color_dark: "#0A0A0A"
    image: "assets/img/derdiedas_last_resized.png"
    image_dark: "assets/img/derdiedas_last_resized.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/img/derdiedas_last_resized.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/img/derdiedas_last_fg.png"
  web:
    generate: true
    image_path: "assets/img/derdiedas_last_resized.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/img/derdiedas_last_resized.png"
  linux:
    generate: true
    image_path: "assets/img/derdiedas_last_resized.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/db/
    - assets/img/
